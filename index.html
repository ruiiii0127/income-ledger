<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>收支帳本 · 家教與獎學金</title>
<style>
  :root{
    --paper:#F5F0E6;
    --card:#FFFDF8;
    --ink:#24312B;
    --ink-soft:#5C6B60;
    --line:#D8CFBC;
    --tutor:#B5562D;
    --tutor-soft:#F1DDCF;
    --job:#3F6357;
    --job-soft:#D9E5E1;
    --scholar:#8B6F1F;
    --scholar-soft:#EFE4C4;
    --rent:#5B7A99;
    --rent-soft:#DCE6EE;
    --status-submit:#7A8B85;
    --status-submit-soft:#E7EAE4;
    --status-approve:#B08A2E;
    --status-approve-soft:#F1E4BE;
    --status-receive:#4B7B4E;
    --status-receive-soft:#DCEADD;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:480px; margin:0 auto; padding:20px 18px 60px; }
  h1{
    font-family:"Noto Serif TC","Songti TC",serif;
    font-weight:700; font-size:22px; letter-spacing:0.02em; margin:0 0 2px;
  }
  .sub{ font-size:13px; color:var(--ink-soft); margin-bottom:16px; }

  .tabs{
    display:flex;
    border-bottom:1px solid var(--line);
    margin-bottom:18px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:10px 4px;
    font-size:14px;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .tab.active{ color:var(--ink); font-weight:700; border-bottom-color:var(--ink); }
  .page{ display:none; }
  .page.active{ display:block; }

  .month-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .month-nav button{
    background:none; border:1px solid var(--line); border-radius:6px;
    width:32px; height:32px; font-size:16px; color:var(--ink); cursor:pointer;
  }
  .month-label{ font-family:"Noto Serif TC",serif; font-size:17px; font-weight:600; }

  .total-card{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:14px; }
  .total-label{ font-size:12px; color:var(--ink-soft); margin-bottom:4px; }
  .total-amount{ font-family:"Noto Serif TC",serif; font-size:34px; font-weight:700; line-height:1.1; }
  .breakdown{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
  .stat{ border-radius:8px; padding:10px 10px; }
  .stat.tutor{ background:var(--tutor-soft); }
  .stat.job{ background:var(--job-soft); }
  .stat.scholar{ background:var(--scholar-soft); }
  .stat.rent{ background:var(--rent-soft); }
  .stat .k{ font-size:11px; margin-bottom:2px; }
  .stat.tutor .k{ color:var(--tutor); }
  .stat.job .k{ color:var(--job); }
  .stat.scholar .k{ color:var(--scholar); }
  .stat.rent .k{ color:var(--rent); }
  .stat .v{ font-size:16px; font-weight:700; }

  .chart-card{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px 10px; margin-bottom:14px; }
  .chart-title{ font-size:12px; color:var(--ink-soft); margin-bottom:10px; }
  .legend{ display:flex; gap:14px; font-size:11px; color:var(--ink-soft); margin-top:8px; flex-wrap:wrap; }
  .legend span{ display:flex; align-items:center; gap:5px; }
  .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }
  .dot.tutor{ background:var(--tutor); }
  .dot.job{ background:var(--job); }
  .dot.scholar{ background:var(--scholar); }
  .dot.rent{ background:var(--rent); }

  .entries{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px 18px; margin-bottom:16px; }
  .entry{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px dashed var(--line); gap:10px; }
  .entry:last-child{ border-bottom:none; }
  .entry-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .tag{ font-size:11px; padding:3px 8px; border-radius:12px; flex-shrink:0; }
  .tag.tutor{ background:var(--tutor-soft); color:var(--tutor); }
  .tag.job{ background:var(--job-soft); color:var(--job); }
  .tag.scholar{ background:var(--scholar-soft); color:var(--scholar); }
  .tag.rent{ background:var(--rent-soft); color:var(--rent); }
  .entry-note{ font-size:13px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .entry-date{ font-size:11px; color:var(--ink-soft); }
  .entry-right{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .entry-amount{ font-weight:700; font-size:15px; }
  .del-btn{ background:none; border:none; color:var(--ink-soft); font-size:16px; cursor:pointer; padding:2px 4px; }

  .empty{ text-align:center; padding:30px 10px; color:var(--ink-soft); font-size:13px; }

  .add-btn{
    width:100%; padding:13px; background:var(--ink); color:var(--paper);
    border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit;
  }

  .form-card{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:14px; display:none; }
  .form-card.open{ display:block; }
  .form-row{ margin-bottom:12px; }
  .form-row label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; }
  .form-row input, .form-row select{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:7px;
    font-size:14px; background:#fff; color:var(--ink); font-family:inherit;
  }
  .form-row-split{ display:flex; gap:10px; }
  .form-row-split .form-row{ flex:1; }
  .type-toggle{ display:flex; gap:8px; }
  .type-toggle button{
    flex:1; padding:9px; border-radius:7px; border:1px solid var(--line);
    background:#fff; font-size:13px; cursor:pointer; color:var(--ink-soft); font-family:inherit;
  }
  .type-toggle button.active.tutor{ background:var(--tutor); border-color:var(--tutor); color:#fff; }
  .type-toggle button.active.job{ background:var(--job); border-color:var(--job); color:#fff; }
  .type-toggle button.active.scholar{ background:var(--scholar); border-color:var(--scholar); color:#fff; }
  .type-toggle button.active.rent{ background:var(--rent); border-color:var(--rent); color:#fff; }
  .hint{ font-size:11px; color:var(--ink-soft); margin-top:-6px; margin-bottom:12px; }
  .form-actions{ display:flex; gap:8px; margin-top:14px; }
  .form-actions button{ flex:1; padding:11px; border-radius:8px; border:none; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn-cancel{ background:transparent; border:1px solid var(--line) !important; color:var(--ink-soft); }
  .btn-save{ background:var(--ink); color:var(--paper); }
  .status{ font-size:12px; color:var(--ink-soft); text-align:center; margin-top:8px; min-height:16px; }

  .roster{ margin-bottom:16px; }
  .roster-card{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; margin-bottom:10px; cursor:pointer;
  }
  .roster-card-top{ display:flex; align-items:center; justify-content:space-between; }
  .roster-name{ font-weight:700; font-size:15px; }
  .roster-rate{ font-size:13px; font-weight:700; }
  .roster-rate.tutor{ color:var(--tutor); }
  .roster-rate.job{ color:var(--job); }
  .roster-sub{ font-size:12px; color:var(--ink-soft); margin-top:3px; }
  .roster-actions{ display:flex; justify-content:flex-end; gap:14px; margin-top:8px; }
  .roster-actions button{ background:none; border:none; font-size:12px; color:var(--ink-soft); cursor:pointer; padding:0; }

  .status-filters{ display:flex; gap:8px; margin-bottom:14px; }
  .status-filters button{
    flex:1; padding:7px 4px; border-radius:7px; border:1px solid var(--line);
    background:#fff; font-size:12px; color:var(--ink-soft); cursor:pointer; font-family:inherit;
  }
  .status-filters button.active{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
  .sch-card{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  .sch-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .sch-name{ font-weight:700; font-size:15px; }
  .sch-amount{ font-size:15px; font-weight:700; }
  .badge{ font-size:11px; padding:3px 9px; border-radius:12px; display:inline-block; margin-top:6px; }
  .badge.submit{ background:var(--status-submit-soft); color:var(--status-submit); }
  .badge.approve{ background:var(--status-approve-soft); color:var(--status-approve); }
  .badge.receive{ background:var(--status-receive-soft); color:var(--status-receive); }
  .paytype-tag{ font-size:11px; color:var(--ink-soft); border:1px solid var(--line); padding:2px 8px; border-radius:10px; margin-left:8px; font-weight:400; }
  .sch-sub{ font-size:12px; color:var(--ink-soft); margin-top:6px; }
  .sch-actions{ display:flex; align-items:center; justify-content:space-between; margin-top:10px; gap:10px; }
  .sch-actions .left{ display:flex; gap:14px; }
  .sch-actions button{ background:none; border:none; font-size:12px; color:var(--ink-soft); cursor:pointer; padding:0; }
  .sch-advance{
    padding:7px 12px !important; border-radius:7px !important; font-weight:600;
    background:var(--ink) !important; color:var(--paper) !important;
  }
  .receive-form{
    display:none; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);
  }
  .receive-form.open{ display:block; }
  .receive-form .form-row-split{ display:flex; gap:10px; margin-bottom:10px; }
  .receive-form .form-row-split .form-row{ flex:1; margin-bottom:0; }

  .weekday-picker{ display:flex; gap:6px; flex-wrap:wrap; }
  .weekday-btn{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
    background:#fff; font-size:13px; color:var(--ink-soft); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-family:inherit; padding:0;
  }
  .weekday-btn.active.tutor{ background:var(--tutor); border-color:var(--tutor); color:#fff; }
  .weekday-btn.active.job{ background:var(--job); border-color:var(--job); color:#fff; }

  .section-label{ font-size:13px; color:var(--ink-soft); margin:20px 0 8px; font-weight:600; }
  .section-label:first-of-type{ margin-top:0; }

  .profile-card{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
  .profile-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .profile-name{ font-weight:700; font-size:15px; }
  .profile-sub{ font-size:12px; color:var(--ink-soft); margin-top:3px; }
  .occ-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-top:1px dashed var(--line); }
  .occ-date{ font-size:13px; color:var(--ink-soft); width:56px; flex-shrink:0; }
  .occ-amount{ font-size:13px; font-weight:600; flex:1; }
  .occ-btn{
    padding:6px 12px; border-radius:7px; border:1px solid var(--line); background:#fff;
    font-size:12px; color:var(--ink-soft); cursor:pointer; white-space:nowrap; font-family:inherit;
  }
  .occ-btn.done{ background:var(--status-receive-soft); border-color:var(--status-receive); color:var(--status-receive); font-weight:600; }
  .monthly-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0 2px; border-top:1px solid var(--line); margin-top:4px; }
  .monthly-label{ font-size:13px; font-weight:600; }
  .occ-remove{
    background:none; border:none; color:var(--ink-soft); font-size:15px; cursor:pointer;
    padding:0 2px; flex-shrink:0; line-height:1;
  }
  .attend-btn{
    background:#fff; border:1px solid var(--line); border-radius:6px; padding:4px 10px;
    font-size:12px; color:var(--ink-soft); cursor:pointer; font-family:inherit; flex-shrink:0;
  }
  .attend-btn.checked{ background:var(--status-receive-soft); border-color:var(--status-receive); color:var(--status-receive); font-weight:600; }
  .hour-input{
    width:48px; padding:4px 6px; border:1px solid var(--line); border-radius:6px;
    font-size:12px; text-align:center; font-family:inherit; color:var(--ink); background:#fff; flex-shrink:0;
  }
  .hour-suffix{ font-size:11px; color:var(--ink-soft); flex-shrink:0; margin-right:auto; }
  .job-summary{
    font-size:12px; color:var(--job); background:var(--job-soft); border-radius:7px;
    padding:8px 10px; margin-top:8px; font-weight:600;
  }
  .add-date-row{ display:flex; gap:8px; margin-top:10px; align-items:center; }
  .add-date-row input{ flex:1; padding:7px 8px; border:1px solid var(--line); border-radius:6px; font-size:13px; font-family:inherit; background:#fff; color:var(--ink); }
  .add-date-row button{ padding:7px 12px; border-radius:6px; border:1px solid var(--line); background:#fff; font-size:12px; color:var(--ink-soft); cursor:pointer; white-space:nowrap; font-family:inherit; }
  .skipped-list{ margin-top:8px; font-size:11px; color:var(--ink-soft); line-height:1.8; }
  .skipped-list button{ background:none; border:none; color:var(--tutor); text-decoration:underline; cursor:pointer; font-size:11px; padding:0; margin-left:6px; font-family:inherit; }
</style>
</head>
<body>
<div class="wrap">
  <h1>收支帳本</h1>
  <div class="sub">家教、工讀與各項補助收入紀錄</div>

  <div class="tabs">
    <div class="tab active" data-tab="overview">總覽</div>
    <div class="tab" data-tab="thismonth">本月</div>
    <div class="tab" data-tab="students">學生</div>
    <div class="tab" data-tab="jobs">工讀</div>
    <div class="tab" data-tab="scholarships">補助</div>
  </div>

  <!-- OVERVIEW PAGE -->
  <div class="page active" id="page-overview">
    <div class="month-nav">
      <button id="prevMonth">‹</button>
      <div class="month-label" id="monthLabel">—</div>
      <button id="nextMonth">›</button>
    </div>

    <div class="total-card">
      <div class="total-label">本月總收入</div>
      <div class="total-amount" id="totalAmount">$0</div>
      <div class="breakdown">
        <div class="stat tutor"><div class="k">家教</div><div class="v" id="tutorTotal">$0</div></div>
        <div class="stat job"><div class="k">工讀</div><div class="v" id="jobTotal">$0</div></div>
        <div class="stat scholar"><div class="k">獎學金</div><div class="v" id="scholarTotal">$0</div></div>
        <div class="stat rent"><div class="k">租屋補助</div><div class="v" id="rentTotal">$0</div></div>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-title">近 6 個月趨勢</div>
      <svg id="trendChart" width="100%" height="120" viewBox="0 0 420 120"></svg>
      <div class="legend">
        <span><i class="dot tutor"></i>家教</span>
        <span><i class="dot job"></i>工讀</span>
        <span><i class="dot scholar"></i>獎學金</span>
        <span><i class="dot rent"></i>租屋補助</span>
      </div>
    </div>

    <button class="add-btn" id="toggleForm">+ 新增一筆收入</button>

    <div class="form-card" id="formCard">
      <div class="form-row">
        <label>類別</label>
        <div class="type-toggle">
          <button type="button" class="tutor" data-type="家教">家教</button>
          <button type="button" class="job" data-type="工讀">工讀</button>
          <button type="button" class="scholar" data-type="獎學金">獎學金</button>
          <button type="button" class="rent" data-type="租屋補助">租屋補助</button>
        </div>
      </div>
      <div class="form-row" id="refSelectRow" style="display:none;">
        <label id="refSelectLabel">選擇學生</label>
        <select id="refSelect"></select>
      </div>
      <div class="form-row-split" id="hoursRow" style="display:none;">
        <div class="form-row">
          <label>時數（選填）</label>
          <input type="number" id="inputHours" placeholder="例如 2" min="0" step="0.5">
        </div>
        <div class="form-row">
          <label>時薪</label>
          <input type="number" id="inputRate" placeholder="—" min="0">
        </div>
      </div>
      <div class="form-row">
        <label>日期</label>
        <input type="date" id="inputDate">
      </div>
      <div class="form-row">
        <label>金額 (NT$)</label>
        <input type="number" id="inputAmount" placeholder="例如 1500" min="0">
      </div>
      <div class="form-row">
        <label>備註（選填）</label>
        <input type="text" id="inputNote" placeholder="例如 王小明 數學家教">
      </div>
      <div class="form-actions">
        <button class="btn-cancel" id="cancelForm">取消</button>
        <button class="btn-save" id="saveEntry">儲存</button>
      </div>
      <div class="status" id="formStatus"></div>
    </div>

    <div class="entries" id="entriesList"></div>

    <div class="chart-card" style="margin-top:16px;">
      <div class="chart-title">備份與還原</div>
      <div class="sub" style="margin:0 0 12px;">建議偶爾匯出備份一次，就算之後開啟環境改變、資料讀不到，也能把備份檔案匯入救回來</div>
      <div class="form-actions" style="margin-top:0;">
        <button class="btn-cancel" id="exportDataBtn">匯出備份</button>
        <button class="btn-save" id="importDataBtn">匯入備份</button>
      </div>
      <input type="file" id="importFileInput" accept="application/json" style="display:none;">
      <div class="status" id="backupStatus"></div>
    </div>
  </div>

  <!-- THIS MONTH PAGE -->
  <div class="page" id="page-thismonth">
    <div class="month-nav">
      <button id="prevMonth2">‹</button>
      <div class="month-label" id="monthLabel2">—</div>
      <button id="nextMonth2">›</button>
    </div>
    <div class="sub" style="margin-top:-8px;margin-bottom:16px;">列出本月需要上的家教與班，領到錢時按「已領取」即可計入收入</div>

    <div class="section-label">家教</div>
    <div id="thisMonthTutorList"></div>

    <div class="section-label">工讀</div>
    <div id="thisMonthJobList"></div>

    <div class="section-label">補助（月領中）</div>
    <div id="thisMonthSubsidyList"></div>
  </div>

  <!-- STUDENTS PAGE -->
  <div class="page" id="page-students">
    <button class="add-btn" id="toggleStudentForm">+ 新增學生</button>

    <div class="form-card" id="studentFormCard">
      <div class="form-row"><label>學生姓名</label><input type="text" id="stuName" placeholder="例如 王小明"></div>
      <div class="form-row"><label>科目</label><input type="text" id="stuSubject" placeholder="例如 國中數學"></div>
      <div class="form-row">
        <label>領取方式</label>
        <div class="type-toggle">
          <button type="button" class="tutor" data-stu-paytype="次領">次領</button>
          <button type="button" class="tutor" data-stu-paytype="兩次領">兩次領</button>
          <button type="button" class="tutor" data-stu-paytype="月領">月領</button>
        </div>
      </div>
      <div class="form-row" id="stuMonthlyModeRow" style="display:none;">
        <label>月領金額怎麼算</label>
        <div class="type-toggle">
          <button type="button" class="tutor" data-stu-monthlymode="fixed">固定金額</button>
          <button type="button" class="tutor" data-stu-monthlymode="bycount">依上課堂數</button>
        </div>
      </div>
      <div class="form-row-split">
        <div class="form-row"><label id="stuRateLabel">時薪 (NT$)</label><input type="number" id="stuRate" placeholder="例如 600" min="0"></div>
        <div class="form-row" id="stuHoursRow"><label>每次時數</label><input type="number" id="stuHours" placeholder="例如 1.5" min="0" step="0.5"></div>
      </div>
      <div class="form-row" id="stuAnchorRow" style="display:none;">
        <label>從哪一堂課開始算（每上 2 次課算一期，用實際上課次數算，不是照日曆天數）</label>
        <input type="date" id="stuAnchor">
      </div>
      <div class="form-row">
        <label>上課星期</label>
        <div class="weekday-picker" id="stuWeekdayPicker">
          <button type="button" class="weekday-btn tutor" data-day="0">日</button>
          <button type="button" class="weekday-btn tutor" data-day="1">一</button>
          <button type="button" class="weekday-btn tutor" data-day="2">二</button>
          <button type="button" class="weekday-btn tutor" data-day="3">三</button>
          <button type="button" class="weekday-btn tutor" data-day="4">四</button>
          <button type="button" class="weekday-btn tutor" data-day="5">五</button>
          <button type="button" class="weekday-btn tutor" data-day="6">六</button>
        </div>
      </div>
      <div class="form-row">
        <label>上課頻率</label>
        <div class="type-toggle">
          <button type="button" class="tutor" data-stu-freq="weekly">每週</button>
          <button type="button" class="tutor" data-stu-freq="biweekly">隔週</button>
        </div>
      </div>
      <div class="form-row" id="stuFreqAnchorRow" style="display:none;">

<script>
const INCOME_KEY = "income-entries";
const STUDENTS_KEY = "students";
const JOBS_KEY = "jobs";
const SCHOLARSHIPS_KEY = "scholarships";
const RECEIPTS_KEY = "receipts";

let entries = [];
let students = [];
let jobs = [];
let scholarships = [];
let receipts = [];
let currentDate = new Date();
let selectedType = "家教";
let editingStudentId = null;
let editingJobId = null;
let editingScholarshipId = null;
let scholarshipFilter = "all";
let receivingId = null;
let selectedStuPayType = "次領";
let selectedStuMonthlyMode = "fixed";
let selectedStuWeekdays = new Set();
let selectedStuFrequency = "weekly";
let selectedJobPayType = "次領";
let selectedJobMonthlyMode = "fixed";
let selectedJobWeekdays = new Set();
let selectedJobFrequency = "weekly";

function fmt(n){ return "$" + Math.round(n).toLocaleString("en-US"); }
function monthKey(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }
function monthLabelText(d){ return d.getFullYear() + " 年 " + (d.getMonth()+1) + " 月"; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

const LS_PREFIX = "income-ledger:";
function hasCloudStorage(){ return typeof window.storage !== "undefined" && window.storage; }

async function loadKey(key){
  if(hasCloudStorage()){
    try{
      const res = await window.storage.get(key, false);
      return res ? JSON.parse(res.value) : [];
    }catch(e){ /* fall through to localStorage */ }
  }
  try{
    const raw = localStorage.getItem(LS_PREFIX + key);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
async function saveKey(key, val){
  if(hasCloudStorage()){
    try{ await window.storage.set(key, JSON.stringify(val), false); return; }
    catch(e){ /* fall through to localStorage */ }
  }
  try{ localStorage.setItem(LS_PREFIX + key, JSON.stringify(val)); }
  catch(e){ console.error("儲存失敗", key, e); }
}

async function loadAll(){
  entries = await loadKey(INCOME_KEY);
  students = await loadKey(STUDENTS_KEY);
  jobs = await loadKey(JOBS_KEY);
  scholarships = await loadKey(SCHOLARSHIPS_KEY);
  receipts = await loadKey(RECEIPTS_KEY);
  renderOverview();
  renderStudents();
  renderJobs();
  renderScholarships();
  renderThisMonth();
}

/* ---------- TABS ---------- */
document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("page-"+tab.dataset.tab).classList.add("active");
  });
});

/* ---------- OVERVIEW ---------- */
function entriesForMonth(key){ return entries.filter(e => e.date.slice(0,7) === key); }
function last6Months(){
  const months = [];
  for(let i=5;i>=0;i--){ months.push(new Date(currentDate.getFullYear(), currentDate.getMonth()-i, 1)); }
  return months;
}
function renderChart(){
  const months = last6Months();
  const svg = document.getElementById("trendChart");
  const data = months.map(d=>{
    const key = monthKey(d);
    const me = entriesForMonth(key);
    const tutor = me.filter(e=>e.type==="家教").reduce((s,e)=>s+e.amount,0);
    const job = me.filter(e=>e.type==="工讀").reduce((s,e)=>s+e.amount,0);
    const scholar = me.filter(e=>e.type==="獎學金").reduce((s,e)=>s+e.amount,0);
    const rent = me.filter(e=>e.type==="租屋補助").reduce((s,e)=>s+e.amount,0);
    return {d, tutor, job, scholar, rent, total: tutor+job+scholar+rent};
  });
  const max = Math.max(...data.map(x=>x.total), 1);
  const w = 420, h = 120, padBottom = 20, barW = 32, gap = (w - barW*6)/7;
  let svgContent = "";
  data.forEach((item, i)=>{
    const x = gap + i*(barW+gap);
    const scale = (h - padBottom - 10) / max;
    const tutorH = item.tutor * scale, jobH = item.job * scale, scholarH = item.scholar * scale, rentH = item.rent * scale;
    const baseY = h - padBottom;
    svgContent += `<rect x="${x}" y="${baseY - rentH}" width="${barW}" height="${rentH}" fill="#5B7A99" rx="2"/>`;
    svgContent += `<rect x="${x}" y="${baseY - rentH - scholarH}" width="${barW}" height="${scholarH}" fill="#8B6F1F" rx="2"/>`;
    svgContent += `<rect x="${x}" y="${baseY - rentH - scholarH - jobH}" width="${barW}" height="${jobH}" fill="#3F6357" rx="2"/>`;
    svgContent += `<rect x="${x}" y="${baseY - rentH - scholarH - jobH - tutorH}" width="${barW}" height="${tutorH}" fill="#B5562D" rx="2"/>`;
    svgContent += `<text x="${x+barW/2}" y="${h-4}" font-size="10" fill="#5C6B60" text-anchor="middle">${item.d.getMonth()+1}月</text>`;
  });
  svg.innerHTML = svgContent;
}
function typeTag(t){ return t==="家教"?"tutor":(t==="工讀"?"job":(t==="租屋補助"?"rent":"scholar")); }

function renderOverview(){
  document.getElementById("monthLabel").textContent = monthLabelText(currentDate);
  const key = monthKey(currentDate);
  const me = entriesForMonth(key).sort((a,b)=> b.date.localeCompare(a.date));
  const tutorSum = me.filter(e=>e.type==="家教").reduce((s,e)=>s+e.amount,0);
  const jobSum = me.filter(e=>e.type==="工讀").reduce((s,e)=>s+e.amount,0);
  const scholarSum = me.filter(e=>e.type==="獎學金").reduce((s,e)=>s+e.amount,0);
  const rentSum = me.filter(e=>e.type==="租屋補助").reduce((s,e)=>s+e.amount,0);

  document.getElementById("totalAmount").textContent = fmt(tutorSum+jobSum+scholarSum+rentSum);
  document.getElementById("tutorTotal").textContent = fmt(tutorSum);
  document.getElementById("jobTotal").textContent = fmt(jobSum);
  document.getElementById("scholarTotal").textContent = fmt(scholarSum);
  document.getElementById("rentTotal").textContent = fmt(rentSum);

  const list = document.getElementById("entriesList");
  if(me.length === 0){
    list.innerHTML = `<div class="empty">這個月還沒有紀錄，按下方按鈕新增一筆吧</div>`;
  }else{
    list.innerHTML = me.map(e=>{
      const cls = typeTag(e.type);
      return `<div class="entry" data-id="${e.id}">
        <div class="entry-left">
          <span class="tag ${cls}">${e.type}</span>
          <div>
            <div class="entry-note">${e.note || (e.type+"收入")}</div>
            <div class="entry-date">${e.date}</div>
          </div>
        </div>
        <div class="entry-right">
          <div class="entry-amount">${fmt(e.amount)}</div>
          <button class="del-btn" data-del="${e.id}">✕</button>
        </div>
      </div>`;
    }).join("");
  }
  renderChart();
}

document.getElementById("prevMonth").addEventListener("click", ()=>{
  currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth()-1, 1);
  renderOverview();
  renderThisMonth();
});
document.getElementById("nextMonth").addEventListener("click", ()=>{
  currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth()+1, 1);
  renderOverview();
  renderThisMonth();
});
document.getElementById("prevMonth2").addEventListener("click", ()=>{
  currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth()-1, 1);
  renderOverview();
  renderThisMonth();
});
document.getElementById("nextMonth2").addEventListener("click", ()=>{
  currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth()+1, 1);
  renderOverview();
  renderThisMonth();
});

/* ---------- INCOME FORM ---------- */
const formCard = document.getElementById("formCard");
document.getElementById("toggleForm").addEventListener("click", ()=>{
  formCard.classList.add("open");
  document.getElementById("inputDate").value = new Date().toISOString().slice(0,10);
  document.getElementById("formStatus").textContent = "";
  updateRefSelect();
});
document.getElementById("cancelForm").addEventListener("click", ()=> resetIncomeForm());
function resetIncomeForm(){
  formCard.classList.remove("open");
  document.getElementById("inputAmount").value = "";
  document.getElementById("inputNote").value = "";
  document.getElementById("inputHours").value = "";
  document.getElementById("inputRate").value = "";
}

document.querySelectorAll("#formCard .type-toggle button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    selectedType = btn.dataset.type;
    document.querySelectorAll("#formCard .type-toggle button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    updateRefSelect();
  });
});
document.querySelector('#formCard .type-toggle button[data-type="家教"]').classList.add("active");

function updateRefSelect(){
  const row = document.getElementById("refSelectRow");
  const hoursRow = document.getElementById("hoursRow");
  const sel = document.getElementById("refSelect");
  const label = document.getElementById("refSelectLabel");
  if(selectedType === "家教"){
    row.style.display = students.length ? "block" : "none";
    hoursRow.style.display = "flex";
    label.textContent = "選擇學生（選填）";
    sel.innerHTML = `<option value="">— 不指定 —</option>` + students.map(s=>`<option value="${s.id}">${s.name}（${s.subject||"家教"}）</option>`).join("");
  }else if(selectedType === "工讀"){
    row.style.display = jobs.length ? "block" : "none";
    hoursRow.style.display = "flex";
    label.textContent = "選擇工作（選填）";
    sel.innerHTML = `<option value="">— 不指定 —</option>` + jobs.map(j=>`<option value="${j.id}">${j.name}</option>`).join("");
  }else{
    row.style.display = "none";
    hoursRow.style.display = "none";
  }
  document.getElementById("inputRate").value = "";
}

document.getElementById("refSelect").addEventListener("change", (e)=>{
  const id = e.target.value;
  const rateInput = document.getElementById("inputRate");
  const noteInput = document.getElementById("inputNote");
  if(!id){ rateInput.value = ""; return; }
  if(selectedType === "家教"){
    const s = students.find(x=>x.id===id);
    if(s){ rateInput.value = s.rate || ""; if(!noteInput.value) noteInput.value = s.name + (s.subject? " "+s.subject : ""); }
  }else if(selectedType === "工讀"){
    const j = jobs.find(x=>x.id===id);
    if(j){ rateInput.value = j.rate || ""; if(!noteInput.value) noteInput.value = j.name; }
  }
});

function recalcAmount(){
  const hours = parseFloat(document.getElementById("inputHours").value);
  const rate = parseFloat(document.getElementById("inputRate").value);
  if(hours > 0 && rate > 0){
    document.getElementById("inputAmount").value = Math.round(hours * rate);
  }
}
document.getElementById("inputHours").addEventListener("input", recalcAmount);
document.getElementById("inputRate").addEventListener("input", recalcAmount);

document.getElementById("saveEntry").addEventListener("click", async ()=>{
  const date = document.getElementById("inputDate").value;
  const amount = parseFloat(document.getElementById("inputAmount").value);
  const note = document.getElementById("inputNote").value.trim();
  const status = document.getElementById("formStatus");
  if(!date){ status.textContent = "請選擇日期"; return; }
  if(!amount || amount <= 0){ status.textContent = "請輸入有效金額"; return; }

  entries.push({ id: uid(), type: selectedType, date, amount, note });
  status.textContent = "儲存中...";
  await saveKey(INCOME_KEY, entries);
  currentDate = new Date(date + "T00:00:00");
  resetIncomeForm();
  renderOverview();
  renderThisMonth();
});

document.getElementById("entriesList").addEventListener("click", async (e)=>{
  const id = e.target.dataset.del;
  if(!id) return;
  entries = entries.filter(en => en.id !== id);
  await saveKey(INCOME_KEY, entries);
  renderOverview();
  renderThisMonth();
});

/* ---------- STUDENTS ---------- */
const studentFormCard = document.getElementById("studentFormCard");
let selectedStuMode = "實體";
document.getElementById("toggleStudentForm").addEventListener("click", ()=>{
  editingStudentId = null;
  clearStudentForm();
  studentFormCard.classList.add("open");
});
document.getElementById("cancelStudentForm").addEventListener("click", ()=>{
  studentFormCard.classList.remove("open");
  clearStudentForm();
});
function setStuMode(mode){
  selectedStuMode = mode;
  document.querySelectorAll('#studentFormCard [data-mode]').forEach(b=>{
    b.classList.toggle("active", b.dataset.mode === mode);
  });
}
document.querySelectorAll('#studentFormCard [data-mode]').forEach(btn=>{
  btn.addEventListener("click", ()=> setStuMode(btn.dataset.mode));
});
function setStuPayType(type){
  selectedStuPayType = type;
  document.querySelectorAll('#studentFormCard [data-stu-paytype]').forEach(b=>{
    b.classList.toggle("active", b.dataset.stuPaytype === type);
  });
  document.getElementById("stuMonthlyModeRow").style.display = type === "月領" ? "block" : "none";
  document.getElementById("stuAnchorRow").style.display = type === "兩次領" ? "block" : "none";
  applyStuAmountFieldState();
}
function applyStuAmountFieldState(){
  const type = selectedStuPayType;
  const mode = selectedStuMonthlyMode;
  const isByCount = type === "月領" && mode === "bycount";
  const showHours = type === "次領" || isByCount;
  document.getElementById("stuRateLabel").textContent =
    type === "月領" ? (isByCount ? "時薪 (NT$)" : "每月固定金額 (NT$)")
    : type === "兩次領" ? "每期金額 (NT$)"
    : "時薪 (NT$)";
  document.getElementById("stuHoursRow").style.display = showHours ? "block" : "none";
}
function setStuMonthlyMode(mode){
  selectedStuMonthlyMode = mode;
  document.querySelectorAll('#studentFormCard [data-stu-monthlymode]').forEach(b=>{
    b.classList.toggle("active", b.dataset.stuMonthlymode === mode);
  });
  applyStuAmountFieldState();
}
document.querySelectorAll('#studentFormCard [data-stu-paytype]').forEach(btn=>{
  btn.addEventListener("click", ()=> setStuPayType(btn.dataset.stuPaytype));
});
document.querySelectorAll('#studentFormCard [data-stu-monthlymode]').forEach(btn=>{
  btn.addEventListener("click", ()=> setStuMonthlyMode(btn.dataset.stuMonthlymode));
});
document.querySelectorAll('#stuWeekdayPicker .weekday-btn').forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const day = btn.dataset.day;
    if(selectedStuWeekdays.has(day)){ selectedStuWeekdays.delete(day); btn.classList.remove("active"); }
    else{ selectedStuWeekdays.add(day); btn.classList.add("active"); }
  });
});
function setStuFrequency(freq){
  selectedStuFrequency = freq;
  document.querySelectorAll('#studentFormCard [data-stu-freq]').forEach(b=>{
    b.classList.toggle("active", b.dataset.stuFreq === freq);
  });
  document.getElementById("stuFreqAnchorRow").style.display = freq === "biweekly" ? "block" : "none";
}
document.querySelectorAll('#studentFormCard [data-stu-freq]').forEach(btn=>{
  btn.addEventListener("click", ()=> setStuFrequency(btn.dataset.stuFreq));
});
function clearStudentForm(){
  document.getElementById("stuName").value = "";
  document.getElementById("stuSubject").value = "";
  document.getElementById("stuRate").value = "";
  document.getElementById("stuHours").value = "";
  document.getElementById("stuAnchor").value = "";
  document.getElementById("stuFreqAnchor").value = "";
  document.getElementById("stuSchedule").value = "";
  document.getElementById("stuNote").value = "";
  document.getElementById("studentFormStatus").textContent = "";
  selectedStuWeekdays = new Set();
  document.querySelectorAll('#stuWeekdayPicker .weekday-btn').forEach(b=>b.classList.remove("active"));
  setStuMode("實體");
  setStuMonthlyMode("fixed");
  setStuPayType("次領");
  setStuFrequency("weekly");
}
document.getElementById("saveStudent").addEventListener("click", async ()=>{
  const name = document.getElementById("stuName").value.trim();
  const status = document.getElementById("studentFormStatus");
  if(!name){ status.textContent = "請輸入學生姓名"; return; }
  const data = {
    id: editingStudentId || uid(),
    name,
    subject: document.getElementById("stuSubject").value.trim(),
    rate: parseFloat(document.getElementById("stuRate").value) || 0,
    hours: parseFloat(document.getElementById("stuHours").value) || 0,
    payType: selectedStuPayType,
    monthlyMode: selectedStuMonthlyMode,
    biweeklyAnchor: document.getElementById("stuAnchor").value || null,

const WEEKDAY_LABELS = ["日","一","二","三","四","五","六"];
function weekdaysText(p){
  const arr = p && p.weekdays;
  if(!arr || arr.length===0) return "尚未設定星期";
  const isBiweekly = p.scheduleFrequency === "biweekly";
  const prefix = isBiweekly ? "隔週" : "每週";

  const anchorNote = (isBiweekly && !p.scheduleAnchor) ? "（尚未設定起算日）" : "";
  return prefix + days + anchorNote;
}

/* ---------- THIS MONTH SCHEDULE ---------- */
function startOfWeekMonday(d){
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
}
function matchesFrequency(dt, p){
  if(p.scheduleFrequency !== "biweekly") return true;
  if(!p.scheduleAnchor) return false;
  const anchor = new Date(p.scheduleAnchor+"T00:00:00");
  if(dt < anchor) return false;
  const wA = startOfWeekMonday(anchor);
  const wD = startOfWeekMonday(dt);
  const diffWeeks = Math.round((wD - wA) / (7*86400000));
  return diffWeeks % 2 === 0;
}
function monthDates(year, month, p){
  if(!p.weekdays || p.weekdays.length===0) return [];
  const set = new Set(p.weekdays.map(Number));
  const days = new Date(year, month+1, 0).getDate();
  const result = [];
  for(let d=1; d<=days; d++){
    const dt = new Date(year, month, d);
    if(set.has(dt.getDay()) && matchesFrequency(dt, p)) result.push(dateStr(dt));
  }
  return result;
}
function dateStr(dt){ return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"); }
function shortDate(iso){ const parts = iso.split("-"); return parts[1]+"/"+parts[2]; }
function findReceipt(refId, period){ return receipts.find(r=>r.refId===refId && r.period===period); }

function allSessionDatesSince(p, anchorStr, throughYear, throughMonth){
  if(!anchorStr || !p.weekdays || p.weekdays.length === 0) return [];
  const anchor = new Date(anchorStr+"T00:00:00");
  const endDate = new Date(throughYear, throughMonth+1, 0);
  if(anchor > endDate) return [];
  const weekdaySet = new Set(p.weekdays.map(Number));
  const skip = new Set(p.skippedDates || []);
  const dates = [];
  const cur = new Date(anchor);
  while(cur <= endDate){
    if(weekdaySet.has(cur.getDay()) && matchesFrequency(cur, p)){
      const ds = dateStr(cur);
      if(!skip.has(ds)) dates.push(ds);
    }
    cur.setDate(cur.getDate()+1);
  }
  const endStr = dateStr(endDate);
  (p.extraDates || []).forEach(d=>{
    if(d >= anchorStr && d <= endStr && !dates.includes(d)) dates.push(d);
  });
  dates.sort();
  return dates;
}

function twoSessionPayments(p, year, month){
  const allDates = allSessionDatesSince(p, p.biweeklyAnchor, year, month);
  const pairs = [];
  for(let i=1; i<allDates.length; i+=2){
    pairs.push({ payDate: allDates[i], sessions: [allDates[i-1], allDates[i]] });
  }
  const monthStr = monthKey(new Date(year, month, 1));
  return pairs.filter(pr => pr.payDate.slice(0,7) === monthStr);
}

function profileMonthDates(p, year, month){
  const skip = new Set(p.skippedDates || []);
  let dates = monthDates(year, month, p).filter(d => !skip.has(d));
  const extraInMonth = (p.extraDates || []).filter(d=>{
    const dt = new Date(d+"T00:00:00");
    return dt.getFullYear()===year && dt.getMonth()===month;
  });
  extraInMonth.forEach(d=>{ if(!dates.includes(d)) dates.push(d); });
  dates.sort();
  return dates;
}

function getHoursForDate(p, d){
  if(p.dailyHours && p.dailyHours[d] !== undefined) return p.dailyHours[d];
  return p.hours || 0;
}

function profileCardHtml(p, category, monthKeyStr, year, month){
  const payType = p.payType || "次領";
  const dates = profileMonthDates(p, year, month);
  const attendedSet = new Set(p.attendedDates || []);
  const perSessionAmount = (p.hours && p.rate) ? p.rate * p.hours : p.rate;
  const refType = category === "家教" ? "student" : "job";
  const isJob = category === "工讀";

  let body = "";
  let jobTotalPay = 0;
  if(dates.length === 0){
    body += `<div class="profile-sub" style="margin-top:8px;">這個月還沒有排定日期</div>`;
  }else if(payType === "次領"){
    body += dates.map(d=>{
      const r = findReceipt(p.id, d);
      const done = !!r;
      if(isJob){
        const hrs = getHoursForDate(p, d);
        const amount = hrs * (p.rate||0);
        jobTotalPay += amount;
        return `<div class="occ-row" style="flex-wrap:wrap;">
          <div class="occ-date">${shortDate(d)}</div>
          <input type="number" class="hour-input" value="${hrs}" min="0" step="0.5"
            data-hour-refid="${p.id}" data-hour-date="${d}"><span class="hour-suffix">hr</span>
          <div class="occ-amount">${fmt(amount)}</div>
          <button class="occ-btn ${done?"done":""}" data-reftype="${refType}" data-refid="${p.id}" data-period="${d}" data-periodtype="daily"
            data-category="${category}" data-amount="${amount}" data-name="${p.name}">${done? "✓ 已領取" : "已領取"}</button>
          ${done ? "" : `<button class="occ-remove" data-sched-action="skip" data-sched-reftype="${refType}" data-sched-refid="${p.id}" data-sched-date="${d}" title="移除這天">✕</button>`}
        </div>`;
      }
      return `<div class="occ-row">
        <div class="occ-date">${shortDate(d)}</div>
        <div class="occ-amount">${fmt(perSessionAmount)}</div>
        <button class="occ-btn ${done?"done":""}" data-reftype="${refType}" data-refid="${p.id}" data-period="${d}" data-periodtype="daily"
          data-category="${category}" data-amount="${perSessionAmount}" data-name="${p.name}">${done? "✓ 已領取" : "已領取"}</button>
        ${done ? "" : `<button class="occ-remove" data-sched-action="skip" data-sched-reftype="${refType}" data-sched-refid="${p.id}" data-sched-date="${d}" title="移除這天">✕</button>`}
      </div>`;
    }).join("");
  }else{
    body += dates.map(d=>{
      const attended = attendedSet.has(d);
      const label = category==="家教" ? "上課" : "上班";
      if(isJob){
        const hrs = getHoursForDate(p, d);
        return `<div class="occ-row" style="flex-wrap:wrap;">
          <div class="occ-date">${shortDate(d)}</div>
          <input type="number" class="hour-input" value="${hrs}" min="0" step="0.5"
            data-hour-refid="${p.id}" data-hour-date="${d}"><span class="hour-suffix">hr</span>
          <button class="attend-btn ${attended?"checked":""}" data-attend-reftype="${refType}" data-attend-refid="${p.id}" data-attend-date="${d}">${attended? "✓ 有上班" : "上班"}</button>
          <button class="occ-remove" data-sched-action="skip" data-sched-reftype="${refType}" data-sched-refid="${p.id}" data-sched-date="${d}" title="移除這天">✕</button>
        </div>`;
      }
      return `<div class="occ-row">
        <div class="occ-date">${shortDate(d)}</div>
        <button class="attend-btn ${attended?"checked":""}" data-attend-reftype="${refType}" data-attend-refid="${p.id}" data-attend-date="${d}">${attended? "✓ 有"+label : label}</button>
        <button class="occ-remove" data-sched-action="skip" data-sched-reftype="${refType}" data-sched-refid="${p.id}" data-sched-date="${d}" title="移除這天">✕</button>
      </div>`;
    }).join("");
  }

  if(payType === "月領"){
    const mr = findReceipt(p.id, monthKeyStr);
    const done = !!mr;
    const isByCount = p.monthlyMode === "bycount";
    const sessionCount = dates.length;
    const monthlyAmount = isByCount ? perSessionAmount * sessionCount : p.rate;
    jobTotalPay = monthlyAmount;
    const label = isByCount
      ? `${category==="家教"?"本月預計上":"本月預計上班"} ${sessionCount} ${category==="家教"?"堂":"次"} · ${fmt(monthlyAmount)}`
      : `本月固定金額 · ${fmt(monthlyAmount)}`;
    body += `<div class="monthly-row">
      <div class="monthly-label">${label}</div>
      <button class="occ-btn ${done?"done":""}" data-reftype="${refType}" data-refid="${p.id}" data-period="${monthKeyStr}" data-periodtype="monthly"
        data-category="${category}" data-amount="${monthlyAmount}" data-name="${p.name}">${done? "✓ 已領取" : "已領取"}</button>
    </div>`;
  }else if(payType === "兩次領"){
    const pairs = twoSessionPayments(p, year, month);
    jobTotalPay = pairs.length * (p.rate||0);
    if(pairs.length === 0){
      body += `<div class="profile-sub" style="margin-top:8px;">${p.biweeklyAnchor ? "本月還沒湊滿 2 次可領款" : "尚未設定起算日"}</div>`;
    }else{
      body += pairs.map(pr=>{
        const done = !!findReceipt(p.id, pr.payDate);
        return `<div class="monthly-row">
          <div class="monthly-label">${shortDate(pr.payDate)} · ${fmt(p.rate)}</div>
          <button class="occ-btn ${done?"done":""}" data-reftype="${refType}" data-refid="${p.id}" data-period="${pr.payDate}" data-periodtype="twosession"
            data-category="${category}" data-amount="${p.rate}" data-name="${p.name}">${done? "✓ 已領取" : "已領取"}</button>
        </div>`;
      }).join("");
    }
  }

  let jobSummaryHtml = "";
  if(isJob && dates.length > 0){
    const totalHours = dates.reduce((sum,d)=> sum + getHoursForDate(p, d), 0);
    const avgWage = totalHours > 0 ? jobTotalPay / totalHours : 0;
    jobSummaryHtml = `<div class="job-summary">本月共上 ${totalHours} 小時 · 平均時薪 ${fmt(avgWage)}</div>`;
  }

  const addInputId = `addDate-${p.id}`;

  return `<div class="profile-card">
    <div class="profile-top">
      <div class="profile-name">${p.name}${p.subject? " · "+p.subject : ""}</div>
      <span class="paytype-tag">${payType}</span>
    </div>
    <div class="profile-sub">${[weekdaysText(p), p.schedule].filter(Boolean).join(" · ")}</div>
    ${body}
    ${jobSummaryHtml}
    <div class="add-date-row">
      <input type="date" id="${addInputId}">
      <button data-sched-action="add" data-sched-reftype="${refType}" data-sched-refid="${p.id}" data-sched-dateinput="${addInputId}">+ 補一天</button>
    </div>
  </div>`;
}

}

async function handleSubsidyReceive(e){
  const btn = e.target.closest("[data-sub-receive]");
  if(!btn || btn.disabled) return;
  const id = btn.dataset.subReceive;
  const s = scholarships.find(x => x.id === id);
  if(!s) return;
  const today = new Date().toISOString().slice(0,10);
  const periodLabel = `${s.name}（第${(s.payments||[]).length+1}期）`;
  const newEntry = { id: uid(), type: s.category || "獎學金", date: today, amount: s.amount, note: periodLabel };
  entries.push(newEntry);
  await saveKey(INCOME_KEY, entries);
  const newPayments = [...(s.payments||[]), { date: today, amount: s.amount, entryId: newEntry.id }];
  const done = s.totalPeriods && newPayments.length >= s.totalPeriods;
  scholarships = scholarships.map(x => x.id === id ? { ...x, payments: newPayments, status: done ? "已領取" : x.status, receivedDate: done ? today : x.receivedDate } : x);
  await saveKey(SCHOLARSHIPS_KEY, scholarships);
  renderThisMonth();
  renderOverview();
  renderScholarships();
}

async function handleThisMonthClick(e){
  const btn = e.target.closest("[data-reftype]");
  if(!btn) return;
  const refType = btn.dataset.reftype;
  const refId = btn.dataset.refid;
  const period = btn.dataset.period;
  const periodType = btn.dataset.periodtype;
  const category = btn.dataset.category;
  const amount = parseFloat(btn.dataset.amount) || 0;
  const name = btn.dataset.name;
  const existing = findReceipt(refId, period);

  if(existing){
    receipts = receipts.filter(r => r.id !== existing.id);
    entries = entries.filter(en => en.id !== existing.entryId);
    await saveKey(RECEIPTS_KEY, receipts);
    await saveKey(INCOME_KEY, entries);
  }else{
    const today = new Date().toISOString().slice(0,10);
    let entryDate, note;
    if(periodType === "monthly"){
      entryDate = today.startsWith(period) ? today : period+"-01";
      note = name + "（本月）";
    }else if(periodType === "twosession"){
      entryDate = period;
      note = name + "（兩次）";
    }else{
      entryDate = period;
      note = name;
    }
    const newEntry = { id: uid(), type: category, date: entryDate, amount, note };
    entries.push(newEntry);
    receipts.push({ id: uid(), refType, refId, period, amount, entryId: newEntry.id });
    await saveKey(INCOME_KEY, entries);
    await saveKey(RECEIPTS_KEY, receipts);
  }
  renderThisMonth();
  renderOverview();
}
async function handleScheduleAction(e){
  const btn = e.target.closest("[data-sched-action]");
  if(!btn) return;
  const action = btn.dataset.schedAction;
  const reftype = btn.dataset.schedReftype;
  const refid = btn.dataset.schedRefid;
  const list = reftype === "student" ? students : jobs;
  const idx = list.findIndex(x => x.id === refid);
  if(idx === -1) return;
  const profile = { ...list[idx] };
  profile.skippedDates = profile.skippedDates ? [...profile.skippedDates] : [];
  profile.extraDates = profile.extraDates ? [...profile.extraDates] : [];

  if(action === "skip"){
    const date = btn.dataset.schedDate;
    if(profile.extraDates.includes(date)){
      profile.extraDates = profile.extraDates.filter(d => d !== date);
    }else if(!profile.skippedDates.includes(date)){
      profile.skippedDates.push(date);
    }
  }else if(action === "restore"){
    const date = btn.dataset.schedDate;
    profile.skippedDates = profile.skippedDates.filter(d => d !== date);
  }else if(action === "add"){
    const inputId = btn.dataset.schedDateinput;
    const date = document.getElementById(inputId).value;
    if(!date) return;
    if(!profile.extraDates.includes(date)) profile.extraDates.push(date);
    profile.skippedDates = profile.skippedDates.filter(d => d !== date);
  }

  list[idx] = profile;
  if(reftype === "student"){
    students = list;
    await saveKey(STUDENTS_KEY, students);
  }else{
    jobs = list;
    await saveKey(JOBS_KEY, jobs);
  }
  renderThisMonth();
}

async function handleHourInputChange(e){
  const input = e.target.closest("[data-hour-refid]");
  if(!input) return;
  const refid = input.dataset.hourRefid;
  const date = input.dataset.hourDate;
  const val = parseFloat(input.value) || 0;
  const idx = jobs.findIndex(x => x.id === refid);
  if(idx === -1) return;
  const profile = { ...jobs[idx] };
  profile.dailyHours = profile.dailyHours ? { ...profile.dailyHours } : {};
  profile.dailyHours[date] = val;
  jobs[idx] = profile;
  await saveKey(JOBS_KEY, jobs);
  renderThisMonth();
}

async function handleAttendToggle(e){
  const btn = e.target.closest("[data-attend-reftype]");
  if(!btn) return;
  const reftype = btn.dataset.attendReftype;
  const refid = btn.dataset.attendRefid;
  const date = btn.dataset.attendDate;
  const list = reftype === "student" ? students : jobs;
  const idx = list.findIndex(x => x.id === refid);
  if(idx === -1) return;
  const profile = { ...list[idx] };
  profile.attendedDates = profile.attendedDates ? [...profile.attendedDates] : [];
  if(profile.attendedDates.includes(date)){
    profile.attendedDates = profile.attendedDates.filter(d => d !== date);
  }else{
    profile.attendedDates.push(date);
  }
  list[idx] = profile;
  if(reftype === "student"){
    students = list;
    await saveKey(STUDENTS_KEY, students);
  }else{
    jobs = list;
    await saveKey(JOBS_KEY, jobs);
  }
  renderThisMonth();
}

function thisMonthListClick(e){
  if(e.target.closest("[data-sub-receive]")){ handleSubsidyReceive(e); return; }
  if(e.target.closest("[data-attend-reftype]")){ handleAttendToggle(e); return; }
  if(e.target.closest("[data-sched-action]")){ handleScheduleAction(e); return; }
  if(e.target.closest("[data-reftype]")){ handleThisMonthClick(e); return; }
}
document.getElementById("thisMonthTutorList").addEventListener("click", thisMonthListClick);
document.getElementById("thisMonthJobList").addEventListener("click", thisMonthListClick);
document.getElementById("thisMonthJobList").addEventListener("change", handleHourInputChange);
document.getElementById("thisMonthSubsidyList").addEventListener("click", thisMonthListClick);

/* ---------- SCHOLARSHIP APPLICATIONS ---------- */
const scholarshipFormCard = document.getElementById("scholarshipFormCard");
let selectedPayType = "一次領";
let selectedSchCategory = "獎學金";

document.getElementById("toggleScholarshipForm").addEventListener("click", ()=>{
  editingScholarshipId = null;
  clearScholarshipForm();
  scholarshipFormCard.classList.add("open");
});
document.getElementById("cancelScholarshipForm").addEventListener("click", ()=>{
  scholarshipFormCard.classList.remove("open");
  clearScholarshipForm();
});
function setSchCategory(cat){
  selectedSchCategory = cat;
  document.querySelectorAll('#scholarshipFormCard [data-category]').forEach(b=>{
    b.classList.toggle("active", b.dataset.category === cat);
  });
}
document.querySelectorAll('#scholarshipFormCard [data-category]').forEach(btn=>{
  btn.addEventListener("click", ()=> setSchCategory(btn.dataset.category));
});
function setPayType(type){
  selectedPayType = type;
  document.querySelectorAll('#scholarshipFormCard [data-paytype]').forEach(b=>{
    b.classList.toggle("active", b.dataset.paytype === type);
  });
  const isMonthly = type === "月領";
  document.getElementById("schPeriodsRow").style.display = isMonthly ? "block" : "none";
  document.getElementById("schAmountLabel").textContent = isMonthly ? "每月金額 (NT$)" : "金額 (NT$)";
}
document.querySelectorAll('#scholarshipFormCard [data-paytype]').forEach(btn=>{
  btn.addEventListener("click", ()=> setPayType(btn.dataset.paytype));
});
function clearScholarshipForm(){
  document.getElementById("schName").value = "";
  document.getElementById("schAmount").value = "";
  document.getElementById("schApplyDate").value = "";
  document.getElementById("schPeriods").value = "";
  document.getElementById("schNote").value = "";
  document.getElementById("scholarshipFormStatus").textContent = "";
  setSchCategory("獎學金");
  setPayType("一次領");
}
document.getElementById("saveScholarship").addEventListener("click", async ()=>{
  const name = document.getElementById("schName").value.trim();
  const status = document.getElementById("scholarshipFormStatus");
  if(!name){ status.textContent = "請輸入補助名稱"; return; }
  const applyDate = document.getElementById("schApplyDate").value;
  const amount = parseFloat(document.getElementById("schAmount").value) || 0;
  const totalPeriods = parseInt(document.getElementById("schPeriods").value) || null;
  const note = document.getElementById("schNote").value.trim();
  if(editingScholarshipId){
    scholarships = scholarships.map(s => s.id === editingScholarshipId ? {
      ...s, name, amount, applyDate, note, payType: selectedPayType, totalPeriods, category: selectedSchCategory,
    } : s);
  }else{
    scholarships.push({
      id: uid(), name, amount, applyDate, note,
      category: selectedSchCategory,
      payType: selectedPayType,
      totalPeriods,
      status: "送件中",
      receivedDate: null,
      entryId: null,
      payments: [],
    });
  }
  await saveKey(SCHOLARSHIPS_KEY, scholarships);
  editingScholarshipId = null;
  scholarshipFormCard.classList.remove("open");
  clearScholarshipForm();
  renderScholarships();
  renderThisMonth();
});

document.querySelectorAll("#scholarshipFilters button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    scholarshipFilter = btn.dataset.filter;
    document.querySelectorAll("#scholarshipFilters button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    renderScholarships();
  });
});

function statusBadgeClass(s){
  return s === "送件中" ? "submit" : (s === "通過" ? "approve" : "receive");
}

function renderScholarships(){
  const list = document.getElementById("scholarshipsList");
  const filtered = scholarshipFilter === "all" ? scholarships : scholarships.filter(s=>s.status === scholarshipFilter);
  const sorted = [...filtered].sort((a,b)=> (b.applyDate||"").localeCompare(a.applyDate||""));
  if(sorted.length === 0){
    list.innerHTML = `<div class="empty">${scholarships.length===0 ? "還沒有補助申請紀錄，新增第一筆吧" : "這個狀態目前沒有紀錄"}</div>`;
    return;
  }
  list.innerHTML = sorted.map(s=>{
    const badgeCls = statusBadgeClass(s.status);
    const isMonthly = s.payType === "月領";
    const payments = s.payments || [];
    const paidCount = payments.length;
    const paidSum = payments.reduce((sum,p)=>sum+p.amount,0);
    const applyInfo = s.applyDate ? `申請日期 ${s.applyDate}` : "未填申請日期";

    let dateInfo, amountDisplay;
    if(!isMonthly){
      dateInfo = s.status === "已領取" ? `${applyInfo} · 領取 ${s.receivedDate}` : applyInfo;
      amountDisplay = fmt(s.amount);
    }else{
      const progress = s.totalPeriods ? `${paidCount}/${s.totalPeriods} 期` : `已領 ${paidCount} 期`;
      dateInfo = `${applyInfo} · 每月 ${fmt(s.amount)} · ${progress}${paidCount ? "・累計 "+fmt(paidSum) : ""}`;
      amountDisplay = fmt(s.amount) + " /月";
    }

    let actionBtn = "";
    if(s.status === "送件中"){
      actionBtn = `<button class="sch-advance" data-approve="${s.id}">標記為已通過</button>`;
    }else if(s.status === "通過"){
      if(!isMonthly){
        actionBtn = `<button class="sch-advance" data-open-receive="${s.id}">標記為已領取</button>`;
      }else{
        actionBtn = `<button class="sch-advance" data-open-receive="${s.id}">登記本期已領取</button>`;
      }
    }else{
      actionBtn = `<span class="badge receive">已入帳 ✓</span>`;
    }
    const finishLink = (isMonthly && s.status === "通過" && !s.totalPeriods && paidCount > 0)
      ? `<button data-finish-sch="${s.id}" style="margin-left:14px;">標記為已領取完畢</button>` : "";

    return `<div class="sch-card" data-id="${s.id}">
      <div class="sch-top">
        <div class="sch-name">${s.name}<span class="paytype-tag">${s.category || "獎學金"}</span><span class="paytype-tag">${s.payType || "一次領"}</span></div>
        <div class="sch-amount">${amountDisplay}</div>
      </div>
      <span class="badge ${badgeCls}">${s.status}</span>
      <div class="sch-sub">${dateInfo}</div>
      ${s.note ? `<div class="sch-sub">${s.note}</div>` : ""}
      <div class="sch-actions">
        <div class="left">
          <button data-edit-sch="${s.id}">編輯</button>
          <button data-del-sch="${s.id}">刪除</button>
          ${finishLink}
        </div>
        ${actionBtn}
      </div>
      <div class="receive-form" id="receiveForm-${s.id}">
        <div class="form-row-split">
          <div class="form-row"><label>${isMonthly ? "本期領取日期" : "領取日期"}</label><input type="date" id="receiveDate-${s.id}" value="${new Date().toISOString().slice(0,10)}"></div>
          <div class="form-row"><label>${isMonthly ? "本期金額" : "實際領取金額"}</label><input type="number" id="receiveAmount-${s.id}" value="${s.amount}" min="0"></div>
        </div>
        <div class="form-actions">
          <button class="btn-cancel" data-cancel-receive="${s.id}">取消</button>
          <button class="btn-save" data-confirm-receive="${s.id}">確認入帳</button>
        </div>
      </div>
    </div>`;
  }).join("");
}

document.getElementById("scholarshipsList").addEventListener("click", async (e)=>{
  const approveId = e.target.dataset.approve;
  const openReceiveId = e.target.dataset.openReceive;
  const cancelReceiveId = e.target.dataset.cancelReceive;
  const confirmReceiveId = e.target.dataset.confirmReceive;
  const finishId = e.target.dataset.finishSch;
  const editId = e.target.dataset.editSch;
  const delId = e.target.dataset.delSch;

  if(approveId){
    scholarships = scholarships.map(s => s.id === approveId ? {...s, status:"通過"} : s);
    await saveKey(SCHOLARSHIPS_KEY, scholarships);
    renderScholarships();
    renderThisMonth();
  }else if(openReceiveId){
    document.querySelectorAll(".receive-form.open").forEach(f=>f.classList.remove("open"));
    document.getElementById("receiveForm-"+openReceiveId).classList.add("open");
  }else if(cancelReceiveId){
    document.getElementById("receiveForm-"+cancelReceiveId).classList.remove("open");
  }else if(confirmReceiveId){
    const dateVal = document.getElementById("receiveDate-"+confirmReceiveId).value;
    const amountVal = parseFloat(document.getElementById("receiveAmount-"+confirmReceiveId).value);
    if(!dateVal || !amountVal || amountVal <= 0){ return; }
    const s = scholarships.find(x=>x.id === confirmReceiveId);
    const isMonthly = s.payType === "月領";
    const periodLabel = isMonthly ? `${s.name}（第${(s.payments||[]).length+1}期）` : s.name;
    const newEntry = { id: uid(), type: s.category || "獎學金", date: dateVal, amount: amountVal, note: periodLabel };
    entries.push(newEntry);
    await saveKey(INCOME_KEY, entries);

    if(!isMonthly){
      scholarships = scholarships.map(x => x.id === confirmReceiveId ? {...x, status:"已領取", receivedDate: dateVal, amount: amountVal, entryId: newEntry.id} : x);
    }else{
      scholarships = scholarships.map(x => {
        if(x.id !== confirmReceiveId) return x;
        const newPayments = [...(x.payments||[]), {date: dateVal, amount: amountVal, entryId: newEntry.id}];
        const done = x.totalPeriods && newPayments.length >= x.totalPeriods;
        return {...x, payments: newPayments, status: done ? "已領取" : x.status, receivedDate: done ? dateVal : x.receivedDate};
      });
    }
    await saveKey(SCHOLARSHIPS_KEY, scholarships);
    currentDate = new Date(dateVal + "T00:00:00");
    renderScholarships();
    renderOverview();
  }else if(finishId){
    scholarships = scholarships.map(s => s.id === finishId ? {...s, status:"已領取"} : s);
    await saveKey(SCHOLARSHIPS_KEY, scholarships);
    renderScholarships();
  }else if(editId){
    const s = scholarships.find(x=>x.id===editId);
    if(!s) return;
    editingScholarshipId = editId;
    document.getElementById("schName").value = s.name;
    document.getElementById("schAmount").value = s.amount || "";
    document.getElementById("schApplyDate").value = s.applyDate || "";
    document.getElementById("schPeriods").value = s.totalPeriods || "";
    document.getElementById("schNote").value = s.note || "";
    setSchCategory(s.category || "獎學金");
    setPayType(s.payType || "一次領");
    scholarshipFormCard.classList.add("open");
  }else if(delId){
    scholarships = scholarships.filter(s=>s.id !== delId);
    await saveKey(SCHOLARSHIPS_KEY, scholarships);
    renderScholarships();
  }
});

/* ---------- BACKUP / RESTORE ---------- */
document.getElementById("exportDataBtn").addEventListener("click", async ()=>{
  const status = document.getElementById("backupStatus");
  const backup = {
    exportedAt: new Date().toISOString(),
    entries, students, jobs, scholarships, receipts,
  };
  try{
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `income-ledger-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    status.textContent = "已匯出備份檔案";
  }catch(e){
    status.textContent = "匯出失敗，請再試一次";
  }
});

document.getElementById("importDataBtn").addEventListener("click", ()=>{
  document.getElementById("importFileInput").click();
});
document.getElementById("importFileInput").addEventListener("change", (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const status = document.getElementById("backupStatus");
  const reader = new FileReader();
  reader.onload = async (evt)=>{
    try{
      const data = JSON.parse(evt.target.result);
      entries = Array.isArray(data.entries) ? data.entries : [];
      students = Array.isArray(data.students) ? data.students : [];
      jobs = Array.isArray(data.jobs) ? data.jobs : [];
      scholarships = Array.isArray(data.scholarships) ? data.scholarships : [];
      receipts = Array.isArray(data.receipts) ? data.receipts : [];
      await saveKey(INCOME_KEY, entries);
      await saveKey(STUDENTS_KEY, students);
      await saveKey(JOBS_KEY, jobs);
      await saveKey(SCHOLARSHIPS_KEY, scholarships);
      await saveKey(RECEIPTS_KEY, receipts);
      renderOverview();
      renderStudents();
      renderJobs();
      renderScholarships();
      renderThisMonth();
      status.textContent = "已還原備份資料";
    }catch(err){
      status.textContent = "這個檔案讀不出來，請確認是匯出的備份檔";
    }
    e.target.value = "";
  };
  reader.readAsText(file);
});
